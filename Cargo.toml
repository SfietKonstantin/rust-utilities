[workspace]
members = [
    "ffi-utilities",
    "ffi-utilities-build",

    # Tests
    "ffi-utilities-build/tests/transparent-substitution",
    "ffi-utilities-test/demo-rust-lib"
]
default-members = ["ffi-utilities", "ffi-utilities-build"]
resolver = "3"

[workspace.dependencies]
ffi-utilities = { path = "ffi-utilities" }
ffi-utilities-build = { path = "ffi-utilities-build" }

cbindgen = { version = "0.29", features = ["unstable_ir"] }
cc = "1.2"
current_platform = "0.2"
insta = "1.47"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"